<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="資格・検定トラッカー">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B8CF7"/>
      <stop offset="0.52" stop-color="#3358E8"/>
      <stop offset="1" stop-color="#1B2C9E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.24" cy="0.16" r="0.85">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="board" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#E4ECFF"/>
    </linearGradient>
  </defs>

  <!-- 背景（iOS が自動で角丸にするため、ここは正方形のまま） -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>

  <!-- 学帽の本体。角帽より先に描いて、白のトーン差でひさしを表現する -->
  <path d="M206 246 V296 Q206 332 256 332 Q306 332 306 296 V246 Z" fill="#C3D3FA"/>

  <!-- 角帽 -->
  <path d="M256 140 L416 209 L256 278 L96 209 Z" fill="url(#board)"/>

  <!-- 房（タッセル） -->
  <path d="M411 213 V266" stroke="#FFC24B" stroke-width="10" stroke-linecap="round" fill="none"/>
  <circle cx="411" cy="283" r="14" fill="#FFC24B"/>
</svg>
